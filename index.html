<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07141b" />
  <title>Танки: Защити Базу!</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#07141b;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
    body{display:grid;place-items:center;overflow:hidden;background:
      radial-gradient(circle at 50% 30%,#2f6573 0,#173541 34%,#08151c 72%,#04090d 100%)}
    main{width:min(920px,92vw);text-align:center}
    .badge{display:inline-block;padding:8px 12px;border:1px solid #ffffff22;border-radius:999px;background:#06111699;color:#bcd0d6;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(48px,9vw,100px);line-height:.84;margin:26px 0 16px;letter-spacing:-.06em}
    h1 span{color:#dcff72;text-shadow:0 0 35px #c9ff5733}
    p{max-width:650px;margin:0 auto 26px;color:#b4c6cb;font-size:18px;line-height:1.55}
    .status{display:inline-flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:#0b1d24cc;border:1px solid #ffffff14}
    .dot{width:10px;height:10px;border-radius:50%;background:#baff62;box-shadow:0 0 18px #baff62}
  </style>
</head>
<body>
  <main>
    <div class="badge">Production build · GitHub connected</div>
    <h1>ТАНКИ:<br><span>ЗАЩИТИ БАЗУ!</span></h1>
    <p>Проект переведён в production-репозиторий. Следующий коммит — перенос игрового ядра, меню, уровней и интеграции Яндекс Игр.</p>
    <div class="status"><span class="dot"></span><strong>Репозиторий подключён</strong></div>
  </main>
</body>
</html>
